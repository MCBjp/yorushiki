<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex">
  <meta name="googlebot" content="noindex,nofollow,noarchive,nosnippet,noimageindex">
  <meta name="bingbot" content="noindex,nofollow,noarchive,nosnippet,noimageindex">

  <title>夜敷 管理ページ</title>
  <link rel="stylesheet" href="admin.css">
</head>

<body>

  <main class="page">

    <section id="login-screen" class="panel login-panel">
      <div class="admin-header">
        <h1>夜敷 管理ページ</h1>
        <p>このページは検索エンジンに登録しない設定です。</p>
      </div>

      <form id="login-form">
        <div class="field">
          <label for="admin-password">パスワード</label>
          <input
            id="admin-password"
            type="password"
            autocomplete="current-password"
            required
          >
        </div>

        <div class="button-row">
          <button class="button button-primary" type="submit">ログイン</button>
        </div>

        <p id="login-message" class="message message-error" aria-live="polite"></p>
      </form>
    </section>

    <section id="admin-screen" class="hidden">

      <header class="admin-header">
        <h1>夜敷 管理ページ</h1>
        <p>公開中のJSONを読み込み、編集内容はこの端末のブラウザ内に一時保存されます。</p>
      </header>

      <div class="top-actions">
        <button id="logout-button" class="button button-small" type="button">
          ログアウト
        </button>
      </div>

      <nav class="tabs" aria-label="編集項目">
        <button class="tab-button is-active" type="button" data-tab="news">
          最新情報
        </button>
        <button class="tab-button" type="button" data-tab="live">
          ライブ
        </button>
        <button class="tab-button" type="button" data-tab="discography">
          作品
        </button>
      </nav>

      <section id="tab-news" class="panel tab-panel">
        <h2 class="section-title">最新情報を追加</h2>

        <form id="news-form">
          <input id="news-edit-index" type="hidden" value="">

          <div class="form-grid">
            <div class="field">
              <label for="news-date">日付</label>
              <input id="news-date" type="date" required>
            </div>

            <div class="field">
              <label for="news-link">リンク先（任意）</label>
              <input id="news-link" type="url" placeholder="https://">
            </div>

            <div class="field field-full">
              <label for="news-text">本文</label>
              <textarea id="news-text" required></textarea>
            </div>

            <div class="field">
              <label for="news-visible">公開状態</label>
              <select id="news-visible">
                <option value="true">公開</option>
                <option value="false">非公開</option>
              </select>
            </div>
          </div>

          <div class="button-row">
            <button class="button button-primary" type="submit">
              保存
            </button>
            <button id="news-cancel-edit" class="button hidden" type="button">
              編集を取り消す
            </button>
          </div>
        </form>

        <div class="entries">
          <h3>登録済み</h3>
          <div id="news-list" class="entry-list"></div>
        </div>
      </section>

      <section id="tab-live" class="panel tab-panel hidden">
        <h2 class="section-title">ライブ情報を追加</h2>

        <form id="live-form">
          <input id="live-edit-index" type="hidden" value="">

          <div class="form-grid">
            <div class="field">
              <label for="live-date">日付</label>
              <input id="live-date" type="date" required>
            </div>

            <div class="field">
              <label for="live-title">イベント名</label>
              <input id="live-title" type="text" required>
            </div>

            <div class="field">
              <label for="live-venue">会場</label>
              <input id="live-venue" type="text" required>
            </div>

            <div class="field">
              <label for="live-ticket-url">チケットURL（任意）</label>
              <input id="live-ticket-url" type="url" placeholder="https://">
            </div>

            <div class="field">
              <label for="live-open">OPEN（任意）</label>
              <input id="live-open" type="time">
            </div>

            <div class="field">
              <label for="live-start">START（任意）</label>
              <input id="live-start" type="time">
            </div>

            <div class="field">
              <label for="live-price">料金（任意）</label>
              <input id="live-price" type="text" placeholder="前売 ¥3,000 + 1D">
            </div>

            <div class="field">
              <label for="live-visible">公開状態</label>
              <select id="live-visible">
                <option value="true">公開</option>
                <option value="false">非公開</option>
              </select>
            </div>

            <div class="field field-full">
              <label for="live-artists">出演者（1行に1組）</label>
              <textarea id="live-artists"></textarea>
            </div>

            <div class="field field-full">
              <label for="live-note">備考（任意）</label>
              <textarea id="live-note"></textarea>
            </div>
          </div>

          <div class="button-row">
            <button class="button button-primary" type="submit">
              保存
            </button>
            <button id="live-cancel-edit" class="button hidden" type="button">
              編集を取り消す
            </button>
          </div>
        </form>

        <div class="entries">
          <h3>登録済み</h3>
          <div id="live-list" class="entry-list"></div>
        </div>
      </section>

      <section id="tab-discography" class="panel tab-panel hidden">
        <h2 class="section-title">作品情報を追加</h2>

        <form id="discography-form">
          <input id="discography-edit-index" type="hidden" value="">

          <div class="form-grid">
            <div class="field">
              <label for="discography-title">タイトル</label>
              <input id="discography-title" type="text" required>
            </div>

            <div class="field">
              <label for="discography-date">発売日</label>
              <input id="discography-date" type="date" required>
            </div>

            <div class="field">
              <label for="discography-type">種別</label>
              <select id="discography-type">
                <option value="DIGITAL SINGLE">DIGITAL SINGLE</option>
                <option value="SINGLE">SINGLE</option>
                <option value="EP">EP</option>
                <option value="ALBUM">ALBUM</option>
                <option value="OTHER">OTHER</option>
              </select>
            </div>

            <div class="field">
              <label for="discography-image">ジャケット画像URL（任意）</label>
              <input id="discography-image" type="text" placeholder="images/example.jpg">
            </div>

            <div class="field field-full">
              <label for="discography-description">説明文（任意）</label>
              <textarea id="discography-description"></textarea>
            </div>

            <div class="field field-full">
              <label for="discography-links">配信リンク（1行に「サービス名|URL」）</label>
              <textarea
                id="discography-links"
                placeholder="Apple Music|https://&#10;Spotify|https://"
              ></textarea>
            </div>

            <div class="field">
              <label for="discography-visible">公開状態</label>
              <select id="discography-visible">
                <option value="true">公開</option>
                <option value="false">非公開</option>
              </select>
            </div>
          </div>

          <div class="button-row">
            <button class="button button-primary" type="submit">
              保存
            </button>
            <button id="discography-cancel-edit" class="button hidden" type="button">
              編集を取り消す
            </button>
          </div>
        </form>

        <div class="entries">
          <h3>登録済み</h3>
          <div id="discography-list" class="entry-list"></div>
        </div>
      </section>

      <section class="panel export-panel">
        <h2>JSONを書き出す</h2>
        <p>
          GitHub上の同名JSONファイルを、この内容で丸ごと置き換えてください。
        </p>

        <div class="button-row">
          <button class="button" type="button" data-export="news">
            news.jsonを表示
          </button>
          <button class="button" type="button" data-export="live">
            live.jsonを表示
          </button>
          <button class="button" type="button" data-export="discography">
            discography.jsonを表示
          </button>
        </div>

        <textarea
          id="json-preview"
          class="json-preview"
          readonly
          aria-label="JSONプレビュー"
        ></textarea>

        <div class="button-row">
          <button id="copy-json" class="button button-primary" type="button">
            JSONをコピー
          </button>
          <button id="download-json" class="button" type="button">
            JSONをダウンロード
          </button>
          <button id="reset-all" class="button button-danger" type="button">
            端末内データを全削除
          </button>
        </div>

        <p id="export-message" class="message message-success" aria-live="polite"></p>

        <div class="notice">
          この管理ページのパスワードは、HTML内のJavaScriptに保存されます。
          本格的な認証ではなく、一般訪問者向けの簡易的な目隠しです。
          GitHubの更新権限そのものは持たせていません。
        </div>
      </section>

    </section>
  </main>
  <script src="admin.js" defer></script>
</body>
</html>
