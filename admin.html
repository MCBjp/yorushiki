<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex">
  <meta name="googlebot" content="noindex,nofollow,noarchive,nosnippet,noimageindex">
  <meta name="bingbot" content="noindex,nofollow,noarchive,nosnippet,noimageindex">

  <title>夜敷 管理ページ</title>

  <style>
    @charset "UTF-8";

    :root {
      --bg: #0e0f12;
      --bg-alt: #17191e;
      --card: #1b1e24;
      --text: #f3f3f0;
      --muted: #9ea3ad;
      --line: rgba(255, 255, 255, 0.14);
      --accent: #3868aa;
      --danger: #9f3b3b;
      --success: #3f7c55;
      --side: clamp(18px, 5vw, 48px);
      --content-width: 920px;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      color-scheme: dark;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background: var(--bg);
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Hiragino Sans",
        "Yu Gothic",
        "YuGothic",
        sans-serif;
      line-height: 1.7;
      letter-spacing: 0.03em;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .hidden {
      display: none !important;
    }

    .page {
      width: min(100%, var(--content-width));
      margin-inline: auto;
      padding: 34px var(--side) 80px;
    }

    .admin-header {
      margin-bottom: 28px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--line);
    }

    .admin-header h1 {
      margin: 0;
      font-family: serif;
      font-size: clamp(1.7rem, 5vw, 2.5rem);
      letter-spacing: 0.08em;
    }

    .admin-header p {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 0.84rem;
    }

    .panel {
      padding: clamp(22px, 5vw, 38px);
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--card);
    }

    .login-panel {
      max-width: 560px;
      margin: 12vh auto 0;
    }

    .login-panel h2 {
      margin: 0 0 18px;
      font-size: 1.25rem;
    }

    .field {
      margin-bottom: 18px;
    }

    .field label {
      display: block;
      margin-bottom: 7px;
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.08em;
    }

    .field input,
    .field textarea,
    .field select {
      width: 100%;
      padding: 12px 13px;
      border: 1px solid var(--line);
      border-radius: 10px;
      color: var(--text);
      background: #111318;
      outline: none;
    }

    .field textarea {
      min-height: 110px;
      resize: vertical;
    }

    .field input:focus,
    .field textarea:focus,
    .field select:focus {
      border-color: rgba(56, 104, 170, 0.85);
      box-shadow: 0 0 0 3px rgba(56, 104, 170, 0.18);
    }

    .button-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .button {
      min-height: 44px;
      padding: 10px 18px;
      border: 1px solid rgba(255, 255, 255, 0.26);
      border-radius: 999px;
      color: #fff;
      background: transparent;
    }

    .button-primary {
      border-color: var(--accent);
      background: var(--accent);
    }

    .button-danger {
      border-color: var(--danger);
      background: transparent;
    }

    .button-small {
      min-height: 36px;
      padding: 7px 13px;
      font-size: 0.76rem;
    }

    .message {
      min-height: 1.5em;
      margin: 12px 0 0;
      font-size: 0.8rem;
    }

    .message-error {
      color: #ff9c9c;
    }

    .message-success {
      color: #9fd5ae;
    }

    .tabs {
      margin-bottom: 24px;
      padding: 6px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--bg-alt);
    }

    .tab-button {
      min-height: 46px;
      padding: 8px;
      border: 0;
      border-radius: 10px;
      color: var(--muted);
      background: transparent;
      font-weight: 700;
      font-size: 0.82rem;
    }

    .tab-button.is-active {
      color: #fff;
      background: var(--accent);
    }

    .section-title {
      margin: 0 0 20px;
      font-size: 1.25rem;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0 16px;
    }

    .field-full {
      grid-column: 1 / -1;
    }

    .entries {
      margin-top: 28px;
    }

    .entries h3 {
      margin: 0 0 12px;
      font-size: 1rem;
    }

    .entry-list {
      display: grid;
      gap: 10px;
    }

    .entry-card {
      padding: 15px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #15171c;
    }

    .entry-card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
    }

    .entry-card h4 {
      margin: 0;
      font-size: 0.95rem;
    }

    .entry-card p {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 0.78rem;
      overflow-wrap: anywhere;
    }

    .entry-actions {
      display: flex;
      gap: 7px;
      flex-shrink: 0;
    }

    .empty {
      padding: 20px;
      border: 1px dashed var(--line);
      border-radius: 12px;
      color: var(--muted);
      text-align: center;
      font-size: 0.82rem;
    }

    .export-panel {
      margin-top: 28px;
    }

    .export-panel h2 {
      margin: 0 0 8px;
      font-size: 1.2rem;
    }

    .export-panel > p {
      margin: 0 0 18px;
      color: var(--muted);
      font-size: 0.82rem;
    }

    .json-preview {
      width: 100%;
      min-height: 220px;
      margin-top: 14px;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 12px;
      color: #d9e0ec;
      background: #0a0b0e;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.74rem;
      line-height: 1.6;
      resize: vertical;
    }

    .notice {
      margin-top: 22px;
      padding: 15px;
      border-left: 3px solid var(--accent);
      color: var(--muted);
      background: rgba(56, 104, 170, 0.08);
      font-size: 0.78rem;
    }

    .top-actions {
      margin-bottom: 18px;
      display: flex;
      justify-content: flex-end;
    }

    @media (max-width: 680px) {
      .page {
        padding-top: 22px;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .field-full {
        grid-column: auto;
      }

      .tabs {
        grid-template-columns: 1fr;
      }

      .entry-card-top {
        flex-direction: column;
      }

      .entry-actions {
        width: 100%;
      }

      .entry-actions .button {
        flex: 1;
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <section id="login-screen" class="panel login-panel">
      <div class="admin-header">
        <h1>夜敷 管理ページ</h1>
        <p>このページは検索エンジンに登録しない設定です。</p>
      </div>

      <form id="login-form">
        <div class="field">
          <label for="admin-password">パスワード</label>
          <input
            id="admin-password"
            type="password"
            autocomplete="current-password"
            required
          >
        </div>

        <div class="button-row">
          <button class="button button-primary" type="submit">ログイン</button>
        </div>

        <p id="login-message" class="message message-error" aria-live="polite"></p>
      </form>
    </section>

    <section id="admin-screen" class="hidden">

      <header class="admin-header">
        <h1>夜敷 管理ページ</h1>
        <p>入力内容はこの端末のブラウザ内に一時保存されます。</p>
      </header>

      <div class="top-actions">
        <button id="logout-button" class="button button-small" type="button">
          ログアウト
        </button>
      </div>

      <nav class="tabs" aria-label="編集項目">
        <button class="tab-button is-active" type="button" data-tab="news">
          最新情報
        </button>
        <button class="tab-button" type="button" data-tab="live">
          ライブ
        </button>
        <button class="tab-button" type="button" data-tab="discography">
          作品
        </button>
      </nav>

      <section id="tab-news" class="panel tab-panel">
        <h2 class="section-title">最新情報を追加</h2>

        <form id="news-form">
          <input id="news-edit-index" type="hidden" value="">

          <div class="form-grid">
            <div class="field">
              <label for="news-date">日付</label>
              <input id="news-date" type="date" required>
            </div>

            <div class="field">
              <label for="news-link">リンク先（任意）</label>
              <input id="news-link" type="url" placeholder="https://">
            </div>

            <div class="field field-full">
              <label for="news-text">本文</label>
              <textarea id="news-text" required></textarea>
            </div>

            <div class="field">
              <label for="news-visible">公開状態</label>
              <select id="news-visible">
                <option value="true">公開</option>
                <option value="false">非公開</option>
              </select>
            </div>
          </div>

          <div class="button-row">
            <button class="button button-primary" type="submit">
              保存
            </button>
            <button id="news-cancel-edit" class="button hidden" type="button">
              編集を取り消す
            </button>
          </div>
        </form>

        <div class="entries">
          <h3>登録済み</h3>
          <div id="news-list" class="entry-list"></div>
        </div>
      </section>

      <section id="tab-live" class="panel tab-panel hidden">
        <h2 class="section-title">ライブ情報を追加</h2>

        <form id="live-form">
          <input id="live-edit-index" type="hidden" value="">

          <div class="form-grid">
            <div class="field">
              <label for="live-date">日付</label>
              <input id="live-date" type="date" required>
            </div>

            <div class="field">
              <label for="live-title">イベント名</label>
              <input id="live-title" type="text" required>
            </div>

            <div class="field">
              <label for="live-venue">会場</label>
              <input id="live-venue" type="text" required>
            </div>

            <div class="field">
              <label for="live-ticket-url">チケットURL（任意）</label>
              <input id="live-ticket-url" type="url" placeholder="https://">
            </div>

            <div class="field">
              <label for="live-open">OPEN（任意）</label>
              <input id="live-open" type="time">
            </div>

            <div class="field">
              <label for="live-start">START（任意）</label>
              <input id="live-start" type="time">
            </div>

            <div class="field">
              <label for="live-price">料金（任意）</label>
              <input id="live-price" type="text" placeholder="前売 ¥3,000 + 1D">
            </div>

            <div class="field">
              <label for="live-visible">公開状態</label>
              <select id="live-visible">
                <option value="true">公開</option>
                <option value="false">非公開</option>
              </select>
            </div>

            <div class="field field-full">
              <label for="live-artists">出演者（1行に1組）</label>
              <textarea id="live-artists"></textarea>
            </div>

            <div class="field field-full">
              <label for="live-note">備考（任意）</label>
              <textarea id="live-note"></textarea>
            </div>
          </div>

          <div class="button-row">
            <button class="button button-primary" type="submit">
              保存
            </button>
            <button id="live-cancel-edit" class="button hidden" type="button">
              編集を取り消す
            </button>
          </div>
        </form>

        <div class="entries">
          <h3>登録済み</h3>
          <div id="live-list" class="entry-list"></div>
        </div>
      </section>

      <section id="tab-discography" class="panel tab-panel hidden">
        <h2 class="section-title">作品情報を追加</h2>

        <form id="discography-form">
          <input id="discography-edit-index" type="hidden" value="">

          <div class="form-grid">
            <div class="field">
              <label for="discography-title">タイトル</label>
              <input id="discography-title" type="text" required>
            </div>

            <div class="field">
              <label for="discography-date">発売日</label>
              <input id="discography-date" type="date" required>
            </div>

            <div class="field">
              <label for="discography-type">種別</label>
              <select id="discography-type">
                <option value="DIGITAL SINGLE">DIGITAL SINGLE</option>
                <option value="SINGLE">SINGLE</option>
                <option value="EP">EP</option>
                <option value="ALBUM">ALBUM</option>
                <option value="OTHER">OTHER</option>
              </select>
            </div>

            <div class="field">
              <label for="discography-image">ジャケット画像URL（任意）</label>
              <input id="discography-image" type="text" placeholder="images/example.jpg">
            </div>

            <div class="field field-full">
              <label for="discography-description">説明文（任意）</label>
              <textarea id="discography-description"></textarea>
            </div>

            <div class="field field-full">
              <label for="discography-links">配信リンク（1行に「サービス名|URL」）</label>
              <textarea
                id="discography-links"
                placeholder="Apple Music|https://&#10;Spotify|https://"
              ></textarea>
            </div>

            <div class="field">
              <label for="discography-visible">公開状態</label>
              <select id="discography-visible">
                <option value="true">公開</option>
                <option value="false">非公開</option>
              </select>
            </div>
          </div>

          <div class="button-row">
            <button class="button button-primary" type="submit">
              保存
            </button>
            <button id="discography-cancel-edit" class="button hidden" type="button">
              編集を取り消す
            </button>
          </div>
        </form>

        <div class="entries">
          <h3>登録済み</h3>
          <div id="discography-list" class="entry-list"></div>
        </div>
      </section>

      <section class="panel export-panel">
        <h2>JSONを書き出す</h2>
        <p>
          GitHub上の同名JSONファイルを、この内容で丸ごと置き換えてください。
        </p>

        <div class="button-row">
          <button class="button" type="button" data-export="news">
            news.jsonを表示
          </button>
          <button class="button" type="button" data-export="live">
            live.jsonを表示
          </button>
          <button class="button" type="button" data-export="discography">
            discography.jsonを表示
          </button>
        </div>

        <textarea
          id="json-preview"
          class="json-preview"
          readonly
          aria-label="JSONプレビュー"
        ></textarea>

        <div class="button-row">
          <button id="copy-json" class="button button-primary" type="button">
            JSONをコピー
          </button>
          <button id="download-json" class="button" type="button">
            JSONをダウンロード
          </button>
          <button id="reset-all" class="button button-danger" type="button">
            端末内データを全削除
          </button>
        </div>

        <p id="export-message" class="message message-success" aria-live="polite"></p>

        <div class="notice">
          この管理ページのパスワードは、HTML内のJavaScriptに保存されます。
          本格的な認証ではなく、一般訪問者向けの簡易的な目隠しです。
          GitHubの更新権限そのものは持たせていません。
        </div>
      </section>

    </section>
  </main>

  <script>
    "use strict";

    /*
      必ず公開前に変更してください。
      ただし、この値はHTMLのソースを調べれば確認できるため、
      本格的なセキュリティ用途には使えません。
    */
    const ADMIN_PASSWORD = "yorushiki-admin";

    const STORAGE_KEY = "yorushiki-admin-data-v1";
    const SESSION_KEY = "yorushiki-admin-login";
    const DEFAULT_DATA = {
      news: [],
      live: [],
      discography: []
    };

    let data = loadData();
    let currentExportType = "news";

    const loginScreen = document.getElementById("login-screen");
    const adminScreen = document.getElementById("admin-screen");
    const loginForm = document.getElementById("login-form");
    const loginMessage = document.getElementById("login-message");
    const logoutButton = document.getElementById("logout-button");

    function loadData() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);

        if (!saved) {
          return structuredClone(DEFAULT_DATA);
        }

        const parsed = JSON.parse(saved);

        return {
          news: Array.isArray(parsed.news) ? parsed.news : [],
          live: Array.isArray(parsed.live) ? parsed.live : [],
          discography: Array.isArray(parsed.discography)
            ? parsed.discography
            : []
        };
      } catch (error) {
        console.error(error);
        return structuredClone(DEFAULT_DATA);
      }
    }

    function saveData() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      renderAll();
      updateJsonPreview(currentExportType);
    }

    function showAdmin() {
      loginScreen.classList.add("hidden");
      adminScreen.classList.remove("hidden");
      renderAll();
      updateJsonPreview(currentExportType);
    }

    function showLogin() {
      adminScreen.classList.add("hidden");
      loginScreen.classList.remove("hidden");
      document.getElementById("admin-password").value = "";
      loginMessage.textContent = "";
    }

    if (sessionStorage.getItem(SESSION_KEY) === "ok") {
      showAdmin();
    }

    loginForm.addEventListener("submit", function (event) {
      event.preventDefault();

      const password = document.getElementById("admin-password").value;

      if (password !== ADMIN_PASSWORD) {
        loginMessage.textContent = "パスワードが違います。";
        return;
      }

      sessionStorage.setItem(SESSION_KEY, "ok");
      loginMessage.textContent = "";
      showAdmin();
    });

    logoutButton.addEventListener("click", function () {
      sessionStorage.removeItem(SESSION_KEY);
      showLogin();
    });

    document.querySelectorAll(".tab-button").forEach(function (button) {
      button.addEventListener("click", function () {
        const tabName = button.dataset.tab;

        document.querySelectorAll(".tab-button").forEach(function (item) {
          item.classList.toggle("is-active", item === button);
        });

        document.querySelectorAll(".tab-panel").forEach(function (panel) {
          panel.classList.add("hidden");
        });

        document.getElementById(`tab-${tabName}`).classList.remove("hidden");
      });
    });

    function booleanValue(value) {
      return value === "true";
    }

    function splitLines(value) {
      return value
        .split("\n")
        .map(function (line) {
          return line.trim();
        })
        .filter(Boolean);
    }

    function parseServiceLinks(value) {
      return splitLines(value).map(function (line) {
        const separatorIndex = line.indexOf("|");

        if (separatorIndex === -1) {
          return {
            service: "",
            url: line
          };
        }

        return {
          service: line.slice(0, separatorIndex).trim(),
          url: line.slice(separatorIndex + 1).trim()
        };
      });
    }

    function formatServiceLinks(links) {
      if (!Array.isArray(links)) {
        return "";
      }

      return links
        .map(function (link) {
          return `${link.service || ""}|${link.url || ""}`;
        })
        .join("\n");
    }

    function sortData() {
      data.news.sort(function (a, b) {
        return String(b.date).localeCompare(String(a.date));
      });

      data.live.sort(function (a, b) {
        return String(a.date).localeCompare(String(b.date));
      });

      data.discography.sort(function (a, b) {
        return String(b.releaseDate).localeCompare(String(a.releaseDate));
      });
    }

    document.getElementById("news-form").addEventListener("submit", function (event) {
      event.preventDefault();

      const editIndex = document.getElementById("news-edit-index").value;
      const item = {
        date: document.getElementById("news-date").value,
        text: document.getElementById("news-text").value.trim(),
        link: document.getElementById("news-link").value.trim(),
        visible: booleanValue(document.getElementById("news-visible").value)
      };

      if (editIndex === "") {
        data.news.push(item);
      } else {
        data.news[Number(editIndex)] = item;
      }

      sortData();
      saveData();
      resetNewsForm();
    });

    document.getElementById("live-form").addEventListener("submit", function (event) {
      event.preventDefault();

      const editIndex = document.getElementById("live-edit-index").value;
      const item = {
        date: document.getElementById("live-date").value,
        title: document.getElementById("live-title").value.trim(),
        venue: document.getElementById("live-venue").value.trim(),
        open: document.getElementById("live-open").value,
        start: document.getElementById("live-start").value,
        price: document.getElementById("live-price").value.trim(),
        artists: splitLines(document.getElementById("live-artists").value),
        ticketUrl: document.getElementById("live-ticket-url").value.trim(),
        note: document.getElementById("live-note").value.trim(),
        visible: booleanValue(document.getElementById("live-visible").value)
      };

      if (editIndex === "") {
        data.live.push(item);
      } else {
        data.live[Number(editIndex)] = item;
      }

      sortData();
      saveData();
      resetLiveForm();
    });

    document
      .getElementById("discography-form")
      .addEventListener("submit", function (event) {
        event.preventDefault();

        const editIndex = document.getElementById(
          "discography-edit-index"
        ).value;

        const item = {
          title: document.getElementById("discography-title").value.trim(),
          releaseDate: document.getElementById("discography-date").value,
          type: document.getElementById("discography-type").value,
          image: document.getElementById("discography-image").value.trim(),
          description: document
            .getElementById("discography-description")
            .value.trim(),
          links: parseServiceLinks(
            document.getElementById("discography-links").value
          ),
          visible: booleanValue(
            document.getElementById("discography-visible").value
          )
        };

        if (editIndex === "") {
          data.discography.push(item);
        } else {
          data.discography[Number(editIndex)] = item;
        }

        sortData();
        saveData();
        resetDiscographyForm();
      });

    function resetNewsForm() {
      document.getElementById("news-form").reset();
      document.getElementById("news-edit-index").value = "";
      document.getElementById("news-visible").value = "true";
      document.getElementById("news-cancel-edit").classList.add("hidden");
    }

    function resetLiveForm() {
      document.getElementById("live-form").reset();
      document.getElementById("live-edit-index").value = "";
      document.getElementById("live-visible").value = "true";
      document.getElementById("live-cancel-edit").classList.add("hidden");
    }

    function resetDiscographyForm() {
      document.getElementById("discography-form").reset();
      document.getElementById("discography-edit-index").value = "";
      document.getElementById("discography-visible").value = "true";
      document
        .getElementById("discography-cancel-edit")
        .classList.add("hidden");
    }

    document
      .getElementById("news-cancel-edit")
      .addEventListener("click", resetNewsForm);

    document
      .getElementById("live-cancel-edit")
      .addEventListener("click", resetLiveForm);

    document
      .getElementById("discography-cancel-edit")
      .addEventListener("click", resetDiscographyForm);

    function renderAll() {
      renderNews();
      renderLive();
      renderDiscography();
    }

    function renderNews() {
      const list = document.getElementById("news-list");

      if (data.news.length === 0) {
        list.innerHTML = '<div class="empty">まだ登録されていません。</div>';
        return;
      }

      list.innerHTML = data.news
        .map(function (item, index) {
          return `
            <article class="entry-card">
              <div class="entry-card-top">
                <div>
                  <h4>${escapeHtml(item.text)}</h4>
                  <p>
                    ${escapeHtml(item.date)}
                    ／ ${item.visible ? "公開" : "非公開"}
                    ${item.link ? `／ ${escapeHtml(item.link)}` : ""}
                  </p>
                </div>

                <div class="entry-actions">
                  <button
                    class="button button-small"
                    type="button"
                    data-action="edit-news"
                    data-index="${index}"
                  >
                    編集
                  </button>

                  <button
                    class="button button-small button-danger"
                    type="button"
                    data-action="delete-news"
                    data-index="${index}"
                  >
                    削除
                  </button>
                </div>
              </div>
            </article>
          `;
        })
        .join("");
    }

    function renderLive() {
      const list = document.getElementById("live-list");

      if (data.live.length === 0) {
        list.innerHTML = '<div class="empty">まだ登録されていません。</div>';
        return;
      }

      list.innerHTML = data.live
        .map(function (item, index) {
          return `
            <article class="entry-card">
              <div class="entry-card-top">
                <div>
                  <h4>${escapeHtml(item.title)}</h4>
                  <p>
                    ${escapeHtml(item.date)}
                    ／ ${escapeHtml(item.venue)}
                    ／ ${item.visible ? "公開" : "非公開"}
                  </p>
                </div>

                <div class="entry-actions">
                  <button
                    class="button button-small"
                    type="button"
                    data-action="edit-live"
                    data-index="${index}"
                  >
                    編集
                  </button>

                  <button
                    class="button button-small button-danger"
                    type="button"
                    data-action="delete-live"
                    data-index="${index}"
                  >
                    削除
                  </button>
                </div>
              </div>
            </article>
          `;
        })
        .join("");
    }

    function renderDiscography() {
      const list = document.getElementById("discography-list");

      if (data.discography.length === 0) {
        list.innerHTML = '<div class="empty">まだ登録されていません。</div>';
        return;
      }

      list.innerHTML = data.discography
        .map(function (item, index) {
          return `
            <article class="entry-card">
              <div class="entry-card-top">
                <div>
                  <h4>${escapeHtml(item.title)}</h4>
                  <p>
                    ${escapeHtml(item.releaseDate)}
                    ／ ${escapeHtml(item.type)}
                    ／ ${item.visible ? "公開" : "非公開"}
                  </p>
                </div>

                <div class="entry-actions">
                  <button
                    class="button button-small"
                    type="button"
                    data-action="edit-discography"
                    data-index="${index}"
                  >
                    編集
                  </button>

                  <button
                    class="button button-small button-danger"
                    type="button"
                    data-action="delete-discography"
                    data-index="${index}"
                  >
                    削除
                  </button>
                </div>
              </div>
            </article>
          `;
        })
        .join("");
    }

    document.addEventListener("click", function (event) {
      const button = event.target.closest("[data-action]");

      if (!button) {
        return;
      }

      const action = button.dataset.action;
      const index = Number(button.dataset.index);

      if (action === "edit-news") {
        editNews(index);
      }

      if (action === "delete-news") {
        deleteItem("news", index);
      }

      if (action === "edit-live") {
        editLive(index);
      }

      if (action === "delete-live") {
        deleteItem("live", index);
      }

      if (action === "edit-discography") {
        editDiscography(index);
      }

      if (action === "delete-discography") {
        deleteItem("discography", index);
      }
    });

    function editNews(index) {
      const item = data.news[index];

      document.getElementById("news-edit-index").value = index;
      document.getElementById("news-date").value = item.date || "";
      document.getElementById("news-text").value = item.text || "";
      document.getElementById("news-link").value = item.link || "";
      document.getElementById("news-visible").value = String(item.visible);
      document.getElementById("news-cancel-edit").classList.remove("hidden");
      document.getElementById("tab-news").scrollIntoView({ behavior: "smooth" });
    }

    function editLive(index) {
      const item = data.live[index];

      document.getElementById("live-edit-index").value = index;
      document.getElementById("live-date").value = item.date || "";
      document.getElementById("live-title").value = item.title || "";
      document.getElementById("live-venue").value = item.venue || "";
      document.getElementById("live-open").value = item.open || "";
      document.getElementById("live-start").value = item.start || "";
      document.getElementById("live-price").value = item.price || "";
      document.getElementById("live-artists").value = Array.isArray(item.artists)
        ? item.artists.join("\n")
        : "";
      document.getElementById("live-ticket-url").value = item.ticketUrl || "";
      document.getElementById("live-note").value = item.note || "";
      document.getElementById("live-visible").value = String(item.visible);
      document.getElementById("live-cancel-edit").classList.remove("hidden");
      document.getElementById("tab-live").scrollIntoView({ behavior: "smooth" });
    }

    function editDiscography(index) {
      const item = data.discography[index];

      document.getElementById("discography-edit-index").value = index;
      document.getElementById("discography-title").value = item.title || "";
      document.getElementById("discography-date").value =
        item.releaseDate || "";
      document.getElementById("discography-type").value =
        item.type || "DIGITAL SINGLE";
      document.getElementById("discography-image").value = item.image || "";
      document.getElementById("discography-description").value =
        item.description || "";
      document.getElementById("discography-links").value =
        formatServiceLinks(item.links);
      document.getElementById("discography-visible").value =
        String(item.visible);
      document
        .getElementById("discography-cancel-edit")
        .classList.remove("hidden");
      document
        .getElementById("tab-discography")
        .scrollIntoView({ behavior: "smooth" });
    }

    function deleteItem(type, index) {
      const confirmed = window.confirm("この項目を削除しますか？");

      if (!confirmed) {
        return;
      }

      data[type].splice(index, 1);
      saveData();
    }

    function getExportData(type) {
      return data[type].filter(function (item) {
        return item.visible;
      });
    }

    function updateJsonPreview(type) {
      currentExportType = type;

      document.getElementById("json-preview").value = JSON.stringify(
        getExportData(type),
        null,
        2
      );
    }

    document.querySelectorAll("[data-export]").forEach(function (button) {
      button.addEventListener("click", function () {
        updateJsonPreview(button.dataset.export);
      });
    });

    document.getElementById("copy-json").addEventListener("click", async function () {
      const preview = document.getElementById("json-preview");
      const message = document.getElementById("export-message");

      try {
        await navigator.clipboard.writeText(preview.value);
        message.textContent = "JSONをコピーしました。";
      } catch (error) {
        preview.select();
        document.execCommand("copy");
        message.textContent = "JSONをコピーしました。";
      }
    });

    document
      .getElementById("download-json")
      .addEventListener("click", function () {
        const json = document.getElementById("json-preview").value;
        const fileName = `${currentExportType}.json`;
        const blob = new Blob([json], {
          type: "application/json;charset=utf-8"
        });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");

        link.href = url;
        link.download = fileName;
        document.body.appendChild(link);
        link.click();
        link.remove();

        URL.revokeObjectURL(url);

        document.getElementById(
          "export-message"
        ).textContent = `${fileName}をダウンロードしました。`;
      });

    document.getElementById("reset-all").addEventListener("click", function () {
      const confirmed = window.confirm(
        "この端末に保存されている管理データをすべて削除しますか？"
      );

      if (!confirmed) {
        return;
      }

      data = structuredClone(DEFAULT_DATA);
      localStorage.removeItem(STORAGE_KEY);
      resetNewsForm();
      resetLiveForm();
      resetDiscographyForm();
      renderAll();
      updateJsonPreview("news");

      document.getElementById(
        "export-message"
      ).textContent = "端末内データを削除しました。";
    });

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    renderAll();
    updateJsonPreview("news");
  </script>
</body>
</html>
