<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow,noarchive">

  <title>LIVE | 夜敷 Official Website</title>
  <meta name="description" content="夜敷のライブスケジュールと過去の出演情報。">

  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="live.css">
  <script src="script.js" defer></script>
</head>

<body id="top">

<header class="site-header">
  <a class="site-logo" href="index.html" aria-label="夜敷 トップページ">夜敷</a>

  <button
    class="menu-button"
    type="button"
    aria-expanded="false"
    aria-controls="global-nav"
    aria-label="メニューを開く"
  >
    <span></span>
    <span></span>
  </button>

  <nav id="global-nav" class="global-nav" aria-label="メインメニュー">
    <a href="index.html">HOME</a>
    <a href="live.html" aria-current="page">LIVE</a>
    <a href="discography.html">DISCOGRAPHY</a>
    <a href="profile.html">PROFILE</a>
    <a href="contact.html">CONTACT</a>
  </nav>
</header>

<main class="live-page">

  <section class="live-page-header">
    <p>YORUSHIKI</p>
    <h1>LIVE</h1>
  </section>

  <section class="live-content">

    <div class="live-tabs" role="tablist" aria-label="ライブ情報の切り替え">
      <button
        id="tab-upcoming"
        class="live-tab is-active"
        type="button"
        role="tab"
        aria-selected="true"
        aria-controls="panel-upcoming"
        data-tab-target="upcoming"
      >
        UPCOMING
      </button>

      <button
        id="tab-past"
        class="live-tab"
        type="button"
        role="tab"
        aria-selected="false"
        aria-controls="panel-past"
        data-tab-target="past"
      >
        PAST
      </button>
    </div>

    <section
      id="panel-upcoming"
      class="live-panel is-active"
      role="tabpanel"
      aria-labelledby="tab-upcoming"
      data-tab-panel="upcoming"
    >
      <article class="live-card">
        <div class="live-card-top">
          <time datetime="2026-09-18">
            <span class="live-date-year">2026</span>
            <span class="live-date-main">09.18</span>
          </time>

          <span class="live-badge">UPCOMING</span>
        </div>

        <h2>下北沢ERA</h2>

        <dl class="live-details">
          <div>
            <dt>OPEN / START</dt>
            <dd>18:30 / 19:00</dd>
          </div>

          <div>
            <dt>ACT</dt>
            <dd>夜敷 / 出演者名 / 出演者名</dd>
          </div>

          <div>
            <dt>TICKET</dt>
            <dd>ADV ¥2,500 / DOOR ¥3,000</dd>
          </div>
        </dl>

        <a class="live-contact-link" href="contact.html">
          TICKET / CONTACT
        </a>
      </article>
    </section>

    <section
      id="panel-past"
      class="live-panel"
      role="tabpanel"
      aria-labelledby="tab-past"
      data-tab-panel="past"
      hidden
    >
      <article class="live-card">
        <div class="live-card-top">
          <time datetime="2025-05-10">
            <span class="live-date-year">2025</span>
            <span class="live-date-main">05.10</span>
          </time>

          <span class="live-badge live-badge-past">PAST</span>
        </div>

        <h2>吉祥寺 BLACK &amp; BLUE</h2>

        <dl class="live-details">
          <div>
            <dt>EVENT</dt>
            <dd>イベント名をここに記載</dd>
          </div>

          <div>
            <dt>ACT</dt>
            <dd>夜敷 / 出演者名 / 出演者名</dd>
          </div>
        </dl>
      </article>
    </section>

  </section>

</main>

<footer class="site-footer">
  <p>© <span id="current-year"></span> 夜敷</p>
  <a href="#top">BACK TO TOP</a>
</footer>

</body>
</html>
