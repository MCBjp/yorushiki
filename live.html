<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow,noarchive">

  <title>LIVE | 夜敷 Official Website</title>
  <meta name="description" content="夜敷のライブスケジュールと過去の出演情報。">

  <link rel="stylesheet" href="style.css?v=17">
  <script src="common.js" defer></script>
  <script src="live.js?v=1" defer></script>
</head>

<body id="top" class="live-page">

<header id="site-header" class="site-header"></header>

<main class="subpage">

  <section class="page-header">
    <div>
      <h1>LIVE</h1>
    </div>
  </section>

  <section class="section">

    <input
      class="live-tab-radio"
      type="radio"
      name="live-tab"
      id="live-upcoming"
      checked
    >

    <input
      class="live-tab-radio"
      type="radio"
      name="live-tab"
      id="live-past"
    >

    <div class="live-tabs" aria-label="ライブ情報">
      <label for="live-upcoming">UPCOMING</label>
      <label for="live-past">PAST</label>
    </div>

    <div class="live-panels">

      <section class="live-panel live-panel-upcoming">
        <div id="live-upcoming-list" class="live-card-list">
          <div class="empty">ライブ情報を読み込んでいます。</div>
        </div>
      </section>

      <section class="live-panel live-panel-past">
        <div id="live-past-list" class="live-card-list">
          <div class="empty">ライブ情報を読み込んでいます。</div>
        </div>
      </section>

    </div>

  </section>

</main>

<footer id="site-footer" class="site-footer"></footer>

</body>
</html>
